name: Release

# 打 tag（v1.2.3）即自动编译全平台安装包、生成 latest.json 并发布统一 Release；也可以在 Actions 页手动跑一次只出产物。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  # ================= Windows x64：NSIS 安装包 + 便携包 =================
  windows:
    name: Windows x64 (setup + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: 构建（NSIS 安装包 + 更新包）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.windows.conf.json

      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "artifacts/HGhub_${v}_x64_setup.exe"
            if (Test-Path "$($setup.FullName).sig") {
              Copy-Item "$($setup.FullName).sig" "artifacts/HGhub_${v}_x64_setup.exe.sig"
            }
          }
          $bin = "src-tauri/target/release/huangguo-client.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhub.exe"
          Compress-Archive -Path "artifacts/HGhub.exe" -DestinationPath "artifacts/HGhub_${v}_x64_portable.zip" -Force
          Remove-Item "artifacts/HGhub.exe"
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/*
          if-no-files-found: error

  # ================= Windows ARM64 (WoA)：NSIS 安装包 + 便携包 =================
  windows-arm64:
    name: Windows ARM64 (setup + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-arm64

      - run: pnpm install --frozen-lockfile

      - name: 构建（WoA NSIS 安装包 + 更新包）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.windows.conf.json --target aarch64-pc-windows-msvc

      - name: 收集产物（安装包 + 便携包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $setup = Get-ChildItem "src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "artifacts/HGhub_${v}_arm64_setup.exe"
            if (Test-Path "$($setup.FullName).sig") {
              Copy-Item "$($setup.FullName).sig" "artifacts/HGhub_${v}_arm64_setup.exe.sig"
            }
          }
          $bin = "src-tauri/target/aarch64-pc-windows-msvc/release/huangguo-client.exe"
          if (-not (Test-Path $bin)) {
            $bin = (Get-ChildItem "src-tauri/target/aarch64-pc-windows-msvc/release" -Filter *.exe | Select-Object -First 1).FullName
          }
          Copy-Item $bin "artifacts/HGhub.exe"
          Compress-Archive -Path "artifacts/HGhub.exe" -DestinationPath "artifacts/HGhub_${v}_arm64_portable.zip" -Force
          Remove-Item "artifacts/HGhub.exe"
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: artifacts/*
          if-no-files-found: error

  # ================= Linux x86_64：deb + AppImage =================
  linux-x64:
    name: Linux x64 (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - name: 安装系统依赖 (Tauri 2 / WebKit2GTK-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            build-essential pkg-config libssl-dev patchelf libfuse2 xdg-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux-x64

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb appimage

      - name: 收集产物
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: artifacts/*
          if-no-files-found: error

  # ================= Linux ARM64：deb + AppImage =================
  linux-arm64:
    name: Linux ARM64 (deb + AppImage)
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - name: 安装系统依赖 (Tauri 2 / WebKit2GTK-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            build-essential pkg-config libssl-dev patchelf libfuse2 xdg-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: linux-arm64

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb appimage

      - name: 收集产物
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: artifacts/*
          if-no-files-found: error

  # ================= Android：按 ABI 分包 + 签名 =================
  android:
    name: Android (split per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（按 ABI 分包）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: 签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64 secret，无法签名"; exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            out="artifacts/HGhub_${VERSION}_${abi}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

  # ================= macOS：arm64 + x64 + universal dmg & updater =================
  macos:
    name: macOS (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: Apple Silicon (arm64)
            arch: arm64
          - target: x86_64-apple-darwin
            name: Intel (x64)
            arch: x64
          - target: universal-apple-darwin
            name: Universal
            arch: universal
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: 构建（${{ matrix.arch }} dmg + 更新包）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.macos.conf.json --target ${{ matrix.target }}

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          for f in $(find "src-tauri/target/${{ matrix.target }}" -name '*.dmg'); do
            cp "$f" "artifacts/HGhub_${V}_${{ matrix.arch }}.dmg"
          done
          for f in $(find "src-tauri/target/${{ matrix.target }}" -name '*.app.tar.gz'); do
            cp "$f" "artifacts/HGhub_${V}_${{ matrix.arch }}.app.tar.gz"
            [ -f "$f.sig" ] && cp "$f.sig" "artifacts/HGhub_${V}_${{ matrix.arch }}.app.tar.gz.sig"
          done
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  # ================= iOS：未签名生产 IPA =================
  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-build

      - run: pnpm install --frozen-lockfile

      - name: 初始化 iOS Xcode 工程
        run: |
          pnpm tauri ios init --ci
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
          done

      - name: 构建 iOS IPA
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifacts/*
          if-no-files-found: error

  # ================= 发布统一 Release + latest.json =================
  release:
    name: Publish GitHub Release
    needs: [windows, windows-arm64, linux-x64, linux-arm64, android, macos, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 获取版本号
        id: ver
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成统一更新清单 latest.json
        run: |
          ls -lh artifacts
          node scripts/make-latest-json.mjs artifacts --tag "${GITHUB_REF_NAME}"
          cat artifacts/latest.json

      - uses: softprops/action-gh-release@v2
        with:
          name: "HGhub ${{ github.ref_name }}（跨平台统一版 · 修复接口协议与免代理直连）"
          body: |
            ## HGhub ${{ github.ref_name }}（跨平台统一版）

            覆盖 macOS / Windows (x64 & ARM64) / Linux (x64 & ARM64) / Android / iOS 的全平台统一版本。

            ### ✨ 本次更新

            - **适配源站 `dx150-edge-v1` 分域加密网关（彻底修复 Issue #3：能 ping 通但全线 503/404 无法加载）**
              - 全量替换已下线的 `/api/edge/request` 接口，基于 `ECDH P-256 + HKDF-SHA256 + AES-256-GCM` 对接 `/api/public/request`、`/api/dynamic/request`、`/api/playback/request` 与 `/api/user/request`（公开列表支持 `X-HG-Public-JSON` 快速通道）。
            - **修复「不翻墙获取镜像失败 / 假绿灯 / 切线后首页不刷新」**
              - Windows 下严格对齐注册表系统代理开关，屏蔽残留环境变量代理导致的 `tunnel error`；当代理连接失败或访问直连友好站点异常时自动降级 `.no_proxy()` 直连重试；
              - 镜像获取与线路探测重构：移除已转为静态导航页的 `huangguoai.ai`（旧配置自动回退主站），探测改为实测 `/api/public/request` 握手可用性，避免假绿灯；增加 `huang-guo.pages.dev` → 种子站点接口 → 导航页多级直连兜底；
              - 切换线路后自动清空旧报错并重新拉取首页与分类视频流；源站已下线栏目返回 `HTTP 410` 时直接提示原因。

            ### 📦 下载

            | 平台 | 架构 | 文件 |
            | --- | --- | --- |
            | macOS | Apple Silicon | `HGhub_${{ steps.ver.outputs.version }}_arm64.dmg` |
            | macOS | Intel | `HGhub_${{ steps.ver.outputs.version }}_x64.dmg` |
            | macOS | Universal | `HGhub_${{ steps.ver.outputs.version }}_universal.dmg` |
            | Windows | ARM64 (WoA) | `HGhub_${{ steps.ver.outputs.version }}_arm64_setup.exe` / `HGhub_${{ steps.ver.outputs.version }}_arm64_portable.zip` |
            | Windows | x86_64 | `HGhub_${{ steps.ver.outputs.version }}_x64_setup.exe` / `HGhub_${{ steps.ver.outputs.version }}_x64_portable.zip` |
