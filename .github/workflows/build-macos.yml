name: Build macOS Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  macos:
    name: macOS (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: Apple Silicon (arm64)
            arch: arm64
          - target: x86_64-apple-darwin
            name: Intel (x64)
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: 对齐版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 macOS 应用 (DMG + APP + 更新包)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --config src-tauri/tauri.macos.conf.json --target ${{ matrix.target }}

      - name: 整理构建产物
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          
          # 收集 dmg 安装包
          found_dmg=0
          for f in $(find src-tauri/target -name '*.dmg'); do
            echo "发现 DMG: $f"
            cp "$f" "artifacts/HGhub_${V}_${{ matrix.arch }}.dmg"
            found_dmg=1
          done

          # 收集 updater 更新包与签名（供应用内自动更新使用）
          found_updater=0
          for f in $(find src-tauri/target -name '*.app.tar.gz'); do
            echo "发现更新包: $f"
            cp "$f" "artifacts/HGhub_${V}_${{ matrix.arch }}.app.tar.gz"
            if [ -f "$f.sig" ]; then
              cp "$f.sig" "artifacts/HGhub_${V}_${{ matrix.arch }}.app.tar.gz.sig"
              found_updater=1
            fi
          done
          
          ls -lh artifacts/
          if [ "$found_dmg" -eq 0 ]; then
            echo "::error::未找到 DMG 构建产物"
            exit 1
          fi
          if [ "$found_updater" -eq 0 ]; then
            echo "::error::未找到已签名的 updater 更新包 (.app.tar.gz.sig)"
            exit 1
          fi

      - name: 上传构建产物 (DMG 免解压直下)
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/HGhub_${{ steps.ver.outputs.version }}_${{ matrix.arch }}.dmg
          archive: false
          if-no-files-found: error

      - name: 上传应用内更新包
        uses: actions/upload-artifact@v7
        with:
          name: updater-${{ matrix.arch }}
          path: artifacts/HGhub_${{ steps.ver.outputs.version }}_${{ matrix.arch }}.app.tar.gz*
          if-no-files-found: error

  latest-json:
    name: 生成更新清单 latest.json
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载更新包与签名
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成 latest.json
        run: |
          ls -lh artifacts
          node scripts/make-latest-json.mjs artifacts

      - name: 上传 latest.json
        uses: actions/upload-artifact@v7
        with:
          name: latest-json
          path: artifacts/latest.json
          if-no-files-found: error

  publish-release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, latest-json]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有 macOS 产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 查看产物列表
        run: ls -lh artifacts

      - name: 获取版本号
        id: ver
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-macos
          name: HGhub v${{ steps.ver.outputs.version }} macOS 专属版
          body: |
            ## HGhub macOS 编译发布版 (v${{ steps.ver.outputs.version }})

            本项目为 [Minireel/HGhub](https://github.com/Minireel/HGhub) 官方源码针对 macOS 平台的编译产物。
            原项目已在 PR #1 完成 macOS 适配支持，但官方尚未在 Release 页面发布 Mac 版产物。

            ### 下载说明
            - **Apple Silicon (M1/M2/M3/M4 系列芯片)**: 推荐下载 `HGhub_${{ steps.ver.outputs.version }}_arm64.dmg`
            - **Intel 芯片**: 推荐下载 `HGhub_${{ steps.ver.outputs.version }}_x64.dmg`

            ### macOS 首次打开说明（绕过未签名提示）
            由于开源个人构建未购买苹果开发者企业证书签名与公证，首次打开若提示“已损坏”或“无法打开”，请在「终端」中执行以下命令清除隔离属性：
            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/HGhub.app
            ```
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
